[project]
name = "jev-evaluator"
version = "0.1.0"
description = "Shared PreToolUse permission-evaluation policy core (deterministic-first, fail-closed) via TypeSafe Jev, used by the Antigravity and ZCode host integrations"
requires-python = ">=3.10"
dependencies = ["typesafe-sdk"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
